# Rust toolchain configuration - OPTIMIZED FOR SPEED
# Minimal components for faster toolchain updates

[toolchain]
channel = "stable"
# Only essential components for faster installation
components = ["rustfmt", "clippy"]
# Use minimal profile for faster toolchain updates
profile = "minimal"
# Uncomment to pin to specific version for consistency
# channel = "1.79.0"

