[package]
name = "runetika"
version = "0.1.0"
edition = "2021"

[dependencies]
# Bevy with MINIMAL features for fast compilation
bevy = { version = "0.16", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_state",
    "default_font",
    "png",
    "x11",  # Linux
    "wayland",  # Linux  
    "bevy_color",
    # NO audio, NO pbr, NO gltf, NO animations, NO debug tools
] }

# 2D Physics
avian2d = { version = "0.3", default-features = false, features = ["2d", "f32", "parry-f32", "default-collider"] }

# Maze generation
bevy_knossos = "0.8"

# Essential dependencies only
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

# Lemma — type-theoretic proof kernel (local path during co-development)
# Optional: enable with `--features lemma` once `../Lemma` is checked out
# alongside this repo. The default build omits the bridge so CI and external
# contributors don't need the sibling repo.
lemma-core     = { path = "../Lemma/crates/lemma-core",     optional = true }
lemma-geometry = { path = "../Lemma/crates/lemma-geometry", optional = true }
lemma-alien    = { path = "../Lemma/crates/lemma-alien",    optional = true }
lemma-verify   = { path = "../Lemma/crates/lemma-verify",   optional = true }

[features]
default = []
lemma = ["dep:lemma-core", "dep:lemma-geometry", "dep:lemma-alien", "dep:lemma-verify"]

# FAST DEV BUILDS - Prioritize compilation speed
[profile.dev]
opt-level = 0           # No optimization
debug = 0               # No debug info
lto = false            # No link time optimization
incremental = true     # Incremental compilation
codegen-units = 256    # Max parallelism

[profile.dev.package."*"]
opt-level = 0          # Don't optimize deps either for fastest builds
debug = 0

# Fast iteration profile
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
strip = "symbols"
lto = false
codegen-units = 256

# Release profile
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"